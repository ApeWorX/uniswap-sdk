[build-system]
requires = ["setuptools>=75.6.0", "wheel", "setuptools_scm[toml]>=5.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uniswap-sdk"
description = "uniswap-sdk: SDK for Uniswap smart contracts"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<4"
authors = [{ name = "ApeWorX Ltd.", email = "admin@apeworx.io" }]
keywords = ["ethereum", "uniswap", "defi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]
dependencies = [
    "eth-ape>=0.8.43,<1",
    "eip712>=0.3",
    "networkx>=3.4.2,<4",
    "ape-tokens>=0.8.5,<1",
]

[project.urls]
Homepage = "https://github.com/ApeWorX/uniswap-sdk"
Repository = "https://github.com/ApeWorX/uniswap-sdk"
Issues = "https://github.com/ApeWorX/uniswap-sdk/issues"

[project.scripts]
uni = "uniswap_sdk._cli:cli"

[project.optional-dependencies]
bot = ["silverback>=0.7.22"]

[dependency-groups]
test = [
    "pytest",
    "pytest-xdist",
    "pytest-cov",
    "hypothesis",
]
lint = [
    "ruff>=0.12.0",
    "mypy>=1.13.0,<2",
    "types-setuptools",
    "mdformat>=0.7.19",
    "mdformat-gfm>=0.3.5",
    "mdformat-frontmatter>=0.4.1",
    "mdformat-pyproject>=0.0.2",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    "commitlint",
    "prek",
    "pytest-watch",
    "IPython",
    "ipdb",
]

[tool.setuptools]
packages = ["uniswap_sdk"]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
uniswap_sdk = ["py.typed", "*.json"]

[tool.setuptools_scm]
write_to = "uniswap_sdk/version.py"

[tool.mypy]
exclude = "build/"
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "C4", "UP", "RET", "SIM", "S", "TCH", "T10", "FIX",
]
ignore = [
    "E501",
    "B904", "B905", "B006", "B007", "B012", "B028", "B018",
    "FIX002", "FIX004",
    "SIM102", "SIM105", "SIM108", "SIM113", "SIM114", "SIM115", "SIM116", "SIM117",
    "RET501", "RET502", "RET503", "RET504", "RET505", "RET506", "RET507", "RET508",
    "S101", "S102", "S105", "S110", "S112", "S113", "S202", "S307", "S311", "S603", "S607",
    "C400", "C416", "C408", "C417", "C414", "C401", "C409", "C419",
    "SIM101", "SIM103", "SIM110", "SIM118", "SIM401", "SIM910",
    "TC001", "TC003", "TC006",
    "UP028",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["D", "E501", "S101", "B011"]
"**/conftest.py" = ["F401", "F841"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["uniswap_sdk"]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
addopts = """
    --cov-branch
    --cov-report term
    --cov-report html
    --cov-report xml
    --cov=uniswap_sdk
"""
python_files = "test_*.py"
testpaths = "tests"
markers = "fuzzing: Run Hypothesis fuzz test suite"

[tool.mdformat]
number = true
